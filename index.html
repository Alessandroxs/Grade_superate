<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notas ¡Supérate!</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg2:#f1f8fc;--card:#fff;--ink:#0b2a40;--mut:#5b7385;--line:#d3e3ee;--blue:#005191;--cyan:#00adda;--green:#98c21e;--g:#4d7f00;--c:#00799f;--ab:#005191;--af:#fff;--ad:#005191;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--bg2:#0a0a0a;--card:#0d0d0d;--ink:#fff;--mut:#a3b4c0;--line:#2b2b2b;--blue:#0b6bb5;--g:#00c26a;--c:#4fe3ee;--ab:#1a1a1a;--ad:#00c26a}}
:root[data-theme="dark"]{--bg:#000;--bg2:#0a0a0a;--card:#0d0d0d;--ink:#fff;--mut:#a3b4c0;--line:#2b2b2b;--blue:#0b6bb5;--g:#00c26a;--c:#4fe3ee;--ab:#1a1a1a;--ad:#00c26a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;overflow-x:clip}
.top{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
.logo{height:56px;max-width:46vw;object-fit:contain}
.who{min-width:0;display:flex;gap:12px;align-items:center;font-size:13px;line-height:1.4}
.av{width:56px;height:56px;flex:none;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.tools{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ur{display:flex;flex-direction:column;gap:2px;min-width:0}.ctl{display:flex;align-items:center;gap:14px;padding-left:4px}.ctl .lk{padding:4px}.thm{display:flex;gap:10px}.thm button{background:none;border:0;cursor:pointer;padding:4px;display:grid}
.lk{background:none;border:0;color:var(--c);cursor:pointer;text-align:left;padding:8px 4px;font-weight:600}
.bar{display:flex;align-items:flex-end;gap:8px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tab{padding:10px 18px;border:1px solid transparent;border-bottom:0;border-radius:14px 14px 0 0;background:none;cursor:pointer}
.tab.on,.nb.on,.seg.on{background:var(--ab);color:var(--af);border-color:var(--ad)}
.burger{display:none;background:none;border:0;padding:8px;cursor:pointer;align-self:center}
.body{display:grid;grid-template-columns:220px 1fr;min-height:70vh}
aside{display:flex;flex-direction:column;gap:10px;padding:16px;border-right:1px solid var(--line)}
.nb{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left;cursor:pointer}
.sp{flex:1}.in{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg2)}
main{padding:16px;min-width:0}
.tt{margin:4px 0 12px;font-size:20px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.cd h3{margin:0 0 8px;font-size:17px}
.r{display:grid;grid-template-columns:70px 1fr 52px 24px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.r small{grid-column:2/-1;color:var(--c);margin-top:-4px}
.hd{font-weight:600;font-size:13px}.t3{grid-template-columns:28px 1fr 52px}.t4{grid-template-columns:1fr 84px 60px 56px}
.rw{background:none;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;cursor:pointer}.rw:hover{background:var(--bg2)}
.g{color:var(--g)}.c{color:var(--c)}.mut{color:var(--mut);margin:0 0 4px}
.dots{background:none;border:0;font-size:20px;cursor:pointer;line-height:1}
.add,.more{margin-top:10px;border:1px solid var(--line);background:var(--bg2);border-radius:20px;padding:8px 16px;cursor:pointer}
.pm{padding-top:10px;font-weight:600}.pm b{color:var(--g)}
.ex{display:flex;gap:10px;align-items:center}.ex b{color:var(--g)}.ex input{width:84px}
.tri{display:flex;align-items:center;justify-content:space-between;gap:12px}.tri small{display:block;color:var(--mut)}
.ring{width:100px;height:100px;border-radius:50%;border:3px solid var(--g);display:grid;place-items:center;font-size:28px;font-weight:700;color:var(--g)}
.ring input{width:72px;text-align:center;border:0;background:none;font-size:26px;font-weight:700;color:var(--g)}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;cursor:pointer;width:100%}
.gr{background:var(--green);color:#16280a}.bl{background:var(--blue);color:#fff}.out{background:none;border:2px solid var(--cyan)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:14px;padding:16px;align-items:end}
.acts label{display:block;font-weight:600;margin-bottom:6px}.pair{display:flex;gap:8px}
.gt{display:flex;gap:6px;padding:0 16px;overflow-x:auto}.gt .tab{flex:1}.pair .btn{padding:14px 6px}.bar.mo{display:none}.acts,.grid{min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:14px;padding:16px;border-top:1px solid var(--line)}
.grid .cd{margin:0}
.login{max-width:430px;margin:0 auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center}
.login .logo{height:auto;max-width:100%;width:290px;margin:0 auto}
.login h1{margin:4px 0;font-size:26px}.login label{text-align:left;font-weight:600}
.vals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 10px;align-items:center;padding:10px 0;font-weight:600;color:var(--c)}
.vals span:nth-child(1){grid-column:1;grid-row:1}.vals span:nth-child(2){grid-column:1;grid-row:2}.vals span:nth-child(3){grid-column:2;grid-row:1/3}.vals span:nth-child(4){grid-column:3;grid-row:1}.vals span:nth-child(5){grid-column:3;grid-row:2}
.pill{align-self:center;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:8px 22px;cursor:pointer}
.err{color:#d8343a;min-height:20px;font-size:14px;margin:0}.hint{color:var(--mut);font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal b{text-align:center;font-size:12px;color:var(--mut)}
.dy{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card)}.dy:not(:disabled){cursor:pointer}
.dy.f{background:#e5484d;color:#fff;border-color:#e5484d}.dy.e{background:#f5c518;color:#2b2200;border-color:#f5c518}.dy.wk{opacity:.35}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mh button{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px}.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:50}
.md{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:440px;width:100%;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.md h3{margin:0}.seg{flex:1;border:1px solid var(--line);background:none;border-radius:10px;padding:10px;cursor:pointer}
.lr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.lr button{min-width:100px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--bg2);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--blue);color:#fff;padding:12px 20px;border-radius:12px;z-index:60}
.scr{display:none}
@media (max-width:760px){
.burger{display:block}.bar.mo{display:flex}.body{grid-template-columns:minmax(0,1fr)}
aside{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--bg);z-index:30;transform:translateX(-102%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.open aside{transform:none}.open .scr{display:block;position:fixed;inset:0;background:#0007;z-index:20;border:0}
.who{font-size:12px}.av{width:48px;height:48px}.r{grid-template-columns:56px 1fr 46px 22px}.t4{grid-template-columns:1fr 74px 50px 50px}}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
